name: Refresh documentation screenshots

on:
  workflow_dispatch:
    inputs:
      tolgee_platform_ref:
        description: 'tolgee-platform ref to build the image from'
        default: 'main'
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: documentation
          token: ${{ secrets.TOLGEE_MACHINE_PAT }}

      - uses: actions/checkout@v4
        with:
          repository: tolgee/tolgee-platform
          ref: ${{ inputs.tolgee_platform_ref }}
          path: tolgee-platform

      - name: Setup environment
        uses: ./tolgee-platform/.github/actions/setup-env

      - name: Build image with the docs module
        working-directory: tolgee-platform
        run: ./gradlew tagDockerLocal

      - name: Install e2e dependencies
        run: |
          npm ci --prefix tolgee-platform/e2e
          npm ci --prefix documentation/screenshots

      - name: Start Tolgee
        working-directory: documentation/screenshots
        run: npm run backend:up

      - name: Capture and write changed screenshots
        working-directory: documentation/screenshots
        run: npm test && npm run refresh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-summary
          path: documentation/screenshots/runner/output/summary.json
          if-no-files-found: ignore

      - name: Stop Tolgee
        if: always()
        working-directory: documentation/screenshots
        run: npm run backend:down

      - uses: peter-evans/create-pull-request@v7
        with:
          path: documentation
          token: ${{ secrets.TOLGEE_MACHINE_PAT }}
          branch: bot/refresh-screenshots
          delete-branch: true
          add-paths: static/img/**
          commit-message: 'chore: refresh documentation screenshots'
          committer: Tolgee Machine <machine@tolgee.io>
          author: Tolgee Machine <machine@tolgee.io>
          title: 'chore: refresh documentation screenshots'
          body: |
            Regenerated by the `Refresh documentation screenshots` workflow from
            tolgee-platform `${{ inputs.tolgee_platform_ref }}`. See the `screenshot-summary`
            artifact for per-file outcomes.
